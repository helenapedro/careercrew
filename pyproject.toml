[project]
name = "careercrew"
version = "0.1.0"
description = "CareerCrew - A Multi-Agent Resume, Interview, and Job-Application Coach Using CrewAI and MCP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai[tools]==1.15.27",
    "mcp==1.28.1",
    "gradio==6.30.0",
    "pydantic==2.12.5",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careercrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "live: opt-in tests that call real external providers (need API keys)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: line length is handled by the formatter.
# UP042: we intentionally use `str, Enum` so JSON/UI values stay as the literal
# status strings (e.g. "PENDING_REVIEW") rather than the member name.
ignore = ["E501", "UP042"]
