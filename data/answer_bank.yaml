# CareerCrew verified answer bank.
#
# These are the ONLY facts the Application Packager agent is allowed to use when
# drafting answers to employer screening questions. Every entry must be confirmed
# by the candidate before it is used; set `verified: true` only after confirming.
#
# The Application Packager must never invent work-authorization, notice-period,
# location, or experience facts. If a screening question has no verified entry
# here, the question goes to `do_not_claim` and is returned to the user for input.

answers:
  - key: work_authorization
    question: "Are you legally authorized to work in the country of this role?"
    answer: "Yes, authorized to work without sponsorship."
    labels:
      - work authorization
      - work authorisation
      - authorized to work
      - sponsorship
      - visa
    verified: true

  - key: notice_period
    question: "What is your notice period / earliest start date?"
    answer: "Two weeks from offer acceptance."
    labels:
      - notice period
      - earliest start
      - start date
      - availability
    verified: true

  - key: location
    question: "Where are you currently based?"
    answer: "Seattle, WA, United States."
    labels:
      - location
      - where are you based
      - current city
    verified: true

  - key: willing_to_relocate
    question: "Are you willing to relocate?"
    answer: "Open to relocation for the right role."
    labels:
      - relocate
      - relocation
      - willing to move
    verified: true

  - key: remote_preference
    question: "What is your work arrangement preference (remote / hybrid / onsite)?"
    answer: "Prefer hybrid; open to fully remote."
    labels:
      - remote
      - hybrid
      - onsite
      - work arrangement
      - work model
    verified: true

  - key: desired_salary_range
    question: "What are your salary expectations?"
    answer: "Negotiable; open to discussing based on the full compensation package."
    labels:
      - salary
      - compensation
      - pay expectation
      - expected salary
    verified: true
