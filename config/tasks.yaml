# CareerCrew tasks. Descriptions and expected outputs only.
# Agent assignment, context wiring, and Pydantic output types are done
# explicitly in careercrew/crew.py (see comments there).

extract_profile:
  description: >
    Produce a structured candidate profile from the resume. If the input
    provides a file path at {resume_path}, read it with the read_resume tool.
    If the resume arrives as pasted text at {resume_text}, use that text
    directly (no file read). Extract only facts present in the document. Never
    infer employers, titles, or dates that are not written.
  expected_output: >
    A CandidateProfile JSON object: summary, skills, work experience (company,
    title, dates, achievements), and education. Empty fields where the resume
    does not state them.

analyze_jd:
  description: >
    Read the job description at {jd_source} using the fetch_job_description
    tool (accepts pasted text or an https URL) and extract required skills,
    keywords, seniority signals, and nice-to-have items, quoting the source text
    for each.
  expected_output: >
    A JobRequirements JSON object: required_skills, keywords, seniority, and
    nice_to_have lists.

analyze_gaps:
  description: >
    Compare the candidate profile against the job requirements. Score overall
    keyword and skill coverage from 0 to 100. For each requirement, give a
    verdict: covered, reframeable (real experience can be reframed to cover
    it), or out_of_scope, with the supporting profile fact for each covered
    or reframeable item.
  expected_output: >
    A GapReport JSON object: coverage_score plus per-requirement verdicts with
    supporting facts.

write_feedback:
  description: >
    Draft 5 to 8 tailored bullet rewrites and 3 interview talking points from
    the gap report. Every bullet must cite the profile fact it is based on.
    List out-of-scope requirements under do_not_claim instead of writing
    bullets for them.
  expected_output: >
    A FeedbackDraft JSON object: rewritten_bullets (text plus cited_fact),
    talking_points, and do_not_claim.

assemble_package:
  description: >
    Assemble the final application package. For EACH employer screening question
    listed in {screening_questions}, call the query_answer_bank tool and use only
    the verified answer it returns (source must be answer_bank). If the answer
    bank has no verified entry, do NOT guess: add the question to do_not_claim.
    Then write a short package_summary that stays consistent with the feedback
    draft. Carry forward the feedback draft's do_not_claim items.
  expected_output: >
    An ApplicationPackage JSON object: role_title, company, screening_answers
    (question, answer, source=answer_bank, verified), package_summary, and
    do_not_claim.
