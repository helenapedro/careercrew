# CareerCrew tasks. Descriptions and expected outputs only.
# Agent assignment, context wiring, and Pydantic output types are done
# explicitly in careercrew/crew.py (see comments there).

extract_profile:
  description: >
    Produce a structured candidate profile from the resume. If the input
    provides a file path at {resume_path}, read it with the read_resume tool.
    If the resume arrives as pasted text at {resume_text}, use that text
    directly (no file read). Extract facts present in the document. Also
    incorporate any candidate-attested updates at {revision_notes}: these are
    skills or experience the candidate confirmed during review (for example
    "I have 5+ years of React") even when they were missing from the original
    resume. Merge those updates into skills and experience. Do not invent
    employers, titles, or dates that appear in neither the resume nor the
    revision notes.
  expected_output: >
    A CandidateProfile JSON object: summary, skills, work experience (company,
    title, dates, achievements), and education. Empty fields where neither the
    resume nor the revision notes state them.

analyze_jd:
  description: >
    Read the job description using the read_job_description tool. Pass the value
    at {jd_path} (an uploaded PDF/DOCX/TXT file name inside the uploads folder)
    or, when that is absent, the pasted text at {jd_text}. Extract required
    skills, keywords, seniority signals, and nice-to-have items, quoting the
    source text for each. Never treat a URL as a job description.
  expected_output: >
    A JobRequirements JSON object: required_skills, keywords, seniority, and
    nice_to_have lists.

analyze_gaps:
  description: >
    Compare the candidate profile against the job requirements. Score overall
    keyword and skill coverage from 0 to 100. For each requirement, give a
    verdict: covered, reframeable (real experience can be reframed to cover
    it), or out_of_scope, with the supporting profile fact for each covered
    or reframeable item. Treat candidate-attested updates from {revision_notes}
    as valid supporting facts. If a requirement was previously out of scope but
    the candidate now claims matching experience in those notes, mark it
    covered or reframeable and cite the attested update.
  expected_output: >
    A GapReport JSON object: coverage_score plus per-requirement verdicts with
    supporting facts.

write_feedback:
  description: >
    Draft 5 to 8 tailored bullet rewrites and 3 interview talking points from
    the gap report. Every bullet must cite the profile fact it is based on
    (resume fact or candidate-attested update from {revision_notes}). List
    requirements that remain out of scope under do_not_claim. When revision
    notes add experience that now covers a requirement, write bullets and
    talking points that use that attested experience.
  expected_output: >
    A FeedbackDraft JSON object: rewritten_bullets (text plus cited_fact),
    talking_points, and do_not_claim.

build_prep_plan:
  description: >
    Build an interview preparation plan calibrated to the target experience
    band: {seniority}. Infer the band from the job requirements' seniority
    field and any years-of-experience signals in the posting when the value
    above is a placeholder. Use the candidate profile, the job requirements,
    and the gap report. Decide which areas deserve the MOST preparation time,
    based on the size and nature of the gaps and that seniority band. For each
    focus area, set a priority (high, medium, low), a suggested share of prep
    time as an integer percentage (all focus areas together should total about
    100), a short reason, and the exact requirement text it comes from. Also
    list question themes to practice, the candidate's strongest areas, and the
    riskiest areas. Never invent experience that appears in neither the resume
    nor {revision_notes}. When revision notes add experience, reduce prep time
    on those formerly missing areas and emphasize rehearsal of the new claims.
  expected_output: >
    An InterviewPrepPlan JSON object: seniority (band, target_years,
    detected_years, confidence, rationale), focus_areas (area, priority,
    suggested_share_pct, why, evidence), question_themes, strengths, and
    risk_areas.

prepare_screening_answers:
  description: >
    Prepare copy-ready answers (nothing is submitted on the candidate's behalf)
    for EACH employer screening question listed in {screening_questions}. Call
    the query_answer_bank tool and use only the verified answer it returns
    (source must be answer_bank). If the answer bank has no verified entry, do
    NOT guess: add the question to do_not_claim. Then write a short
    package_summary that explains these are copy-ready answers the candidate
    can paste into their own application. Carry forward the feedback draft's
    do_not_claim items. Mention any human revision notes at {revision_notes}
    in the package_summary when they are not empty.
  expected_output: >
    A ScreeningPrep JSON object: role_title, company, screening_answers
    (question, answer, source=answer_bank, verified), package_summary, and
    do_not_claim.
